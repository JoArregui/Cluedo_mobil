<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Cluedo Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #dice-overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 12, 0.72);
      z-index: 100;
      touch-action: none;
      cursor: pointer;
      transition: opacity 0.45s ease;
    }
    #dice-overlay.visible { display: flex; }
    #dice-overlay.fading { opacity: 0; pointer-events: none; }
    #dice-canvas {
      width: min(88vw, 340px) !important;
      height: min(44vw, 170px) !important;
      border-radius: 16px;
    }
    #dice-hint {
      margin-top: 18px;
      color: rgba(255, 220, 150, 0.92);
      font: 600 14px/1.4 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
<div id="dice-overlay">
  <canvas id="dice-canvas"></canvas>
  <p id="dice-hint">Agita el móvil o toca los dados</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ── Escena ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 50, 90);

// ── Cámara ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
const dist = 30, elev = 30 * Math.PI / 180, rot = 20 * Math.PI / 180;
camera.position.set(
  dist * Math.cos(elev) * Math.sin(rot),
  dist * Math.sin(elev),
  dist * Math.cos(elev) * Math.cos(rot)
);
camera.lookAt(0, 0, 0);

// ── OrbitControls ─────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = 1.35;
controls.target.set(0, 0, 0);
controls.update();

// ── Luces ─────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const mainLight = new THREE.DirectionalLight(0xffffff, 0.6);
mainLight.position.set(5, 20, 8);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
mainLight.shadow.camera.near = 0.5;
mainLight.shadow.camera.far = 60;
mainLight.shadow.camera.left = -16;
mainLight.shadow.camera.right = 16;
mainLight.shadow.camera.top = 16;
mainLight.shadow.camera.bottom = -16;
scene.add(mainLight);

// ── Conversión de coordenadas ─────────────────────────────────────────────────
// Grid Dart: x: 0..23 (24 cols), y: 0..24 (25 rows)
// Centro del grid: (11.5, 12) → Three.js (0, 0)
const BOARD_COLUMNS = 24;
const BOARD_ROWS = 25;
const BOARD_HALF_X = (BOARD_COLUMNS - 1) / 2;
const BOARD_HALF_Y = (BOARD_ROWS - 1) / 2;

function tileToThree(tileX, tileY) {
  return { x: tileX - BOARD_HALF_X, z: tileY - BOARD_HALF_Y };
}

function threeToTile(worldX, worldZ) {
  return {
    x: Math.round(worldX + BOARD_HALF_X),
    y: Math.round(worldZ + BOARD_HALF_Y),
  };
}

function isInsideGrid(tileX, tileY) {
  return tileX >= 0 && tileX < BOARD_COLUMNS && tileY >= 0 && tileY < BOARD_ROWS;
}

function roomCenter(x0, x1, y0, y1) {
  const midpointX = (x0 + x1) / 2;
  const midpointY = (y0 + y1) / 2;
  let bestX = Math.round(midpointX);
  let bestY = Math.round(midpointY);
  let bestDistance = Number.POSITIVE_INFINITY;

  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      const distance = (x - midpointX) ** 2 + (y - midpointY) ** 2;
      if (distance < bestDistance) {
        bestDistance = distance;
        bestX = x;
        bestY = y;
      }
    }
  }

  return tileToThree(bestX, bestY);
}

// ── Definición de habitaciones (solo para posicionar tokens y highlights) ─────
let ROOMS = [
  { id: 'study',         x0: 1,  x1: 5,  y0: 1,  y1: 4  },
  { id: 'hall',          x0: 9,  x1: 13, y0: 1,  y1: 5  },
  { id: 'lounge',        x0: 17, x1: 21, y0: 1,  y1: 5  },
  { id: 'library',       x0: 1,  x1: 6,  y0: 7,  y1: 10 },
  { id: 'dining_room',   x0: 16, x1: 22, y0: 8,  y1: 14 },
  { id: 'billiard_room', x0: 1,  x1: 5,  y0: 12, y1: 16 },
  { id: 'conservatory',  x0: 1,  x1: 5,  y0: 18, y1: 22 },
  { id: 'ballroom',      x0: 8,  x1: 14, y0: 18, y1: 22 },
  { id: 'kitchen',       x0: 17, x1: 21, y0: 18, y1: 22 },
];

let BLOCKED_ZONES = [
  { x0: 9,  x1: 14, y0: 8,  y1: 14 },
  { x0: 7,  x1: 8,  y0: 1,  y1: 3  },
  { x0: 15, x1: 15, y0: 1,  y1: 4  },
  { x0: 7,  x1: 8,  y0: 21, y1: 24 },
  { x0: 16, x1: 16, y0: 22, y1: 24 },
  { x0: 22, x1: 23, y0: 21, y1: 24 },
];

// Puertas: walkway que queda frente al hueco de cada habitación.
// (Sincronizado con _doorConnections en board_map.dart)
let DOORWAYS = [
  { x: 6,  y: 4  }, // study
  { x: 8,  y: 5  }, // hall
  { x: 11, y: 6  }, // hall
  { x: 16, y: 4  }, // lounge
  { x: 19, y: 6  }, // lounge
  { x: 7,  y: 8  }, // library
  { x: 6,  y: 11 }, // library
  { x: 15, y: 11 }, // dining_room
  { x: 15, y: 13 }, // dining_room
  { x: 6,  y: 13 }, // billiard_room
  { x: 6,  y: 15 }, // billiard_room
  { x: 6,  y: 19 }, // conservatory
  { x: 6,  y: 21 }, // conservatory
  { x: 8,  y: 17 }, // ballroom
  { x: 14, y: 17 }, // ballroom
  { x: 15, y: 15 }, // ballroom (puerta hacia dining)
  { x: 16, y: 20 }, // kitchen
  { x: 19, y: 17 }, // kitchen
];

function applyBoardLayout(layout) {
  if (!layout) return;

  const normalizedRooms = Array.isArray(layout.rooms)
    ? layout.rooms.map(room => ({
        id: room.id,
        x0: room.x0 ?? 0,
        x1: room.x1 ?? 0,
        y0: room.y0 ?? 0,
        y1: room.y1 ?? 0,
      }))
    : [];

  const normalizedZones = Array.isArray(layout.inaccessibleZones)
    ? layout.inaccessibleZones.map(zone => ({
        x0: zone.x0 ?? 0,
        x1: zone.x1 ?? 0,
        y0: zone.y0 ?? 0,
        y1: zone.y1 ?? 0,
      }))
    : [];

  ROOMS = normalizedRooms.length > 0 ? normalizedRooms : ROOMS;
  BLOCKED_ZONES = normalizedZones.length > 0 ? normalizedZones : BLOCKED_ZONES;

  ROOM_POSITIONS = {};
  ROOMS.forEach(r => {
    const c = roomCenter(r.x0, r.x1, r.y0, r.y1);
    ROOM_POSITIONS[r.id] = [c.x, c.z];
  });
}

function inBounds(tileX, tileY, bounds) {
  return tileX >= bounds.x0 && tileX <= bounds.x1 && tileY >= bounds.y0 && tileY <= bounds.y1;
}

function isBlockedTile(tileX, tileY) {
  return BLOCKED_ZONES.some(bounds => inBounds(tileX, tileY, bounds));
}

let ROOM_POSITIONS = {};
ROOMS.forEach(r => {
  const c = roomCenter(r.x0, r.x1, r.y0, r.y1);
  ROOM_POSITIONS[r.id] = [c.x, c.z];
});

// ── Construcción del tablero ──────────────────────────────────────────────────
function buildBoard() {
  // Suelo base oscuro
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(BOARD_COLUMNS, BOARD_ROWS),
    new THREE.MeshStandardMaterial({ color: 0x080810, roughness: 1.0 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Textura del tablero
  const boardOverlayTex = new THREE.TextureLoader().load(
    './board_texture.png',
    (tex) => { tex.needsUpdate = true; },
    undefined,
    (err) => console.warn('board_texture.png no encontrado:', err)
  );
  // FIX: el texture board_texture.png (1024x971) tiene un marco marrón decorativo
  // alrededor del tablero Cluedo real. Si mapeamos el texture completo al
  // PlaneGeometry(24, 25), las celdas lógicas se comprimen para cubrir ese marco
  // y los tokens/highlights no caen sobre las casillas visibles.
  // Remapeamos UVs para que SOLO la zona del tablero Cluedo (sin el marco marrón)
  // se mapee al plane completo. Esto NO afecta a tileToThree/threeToTile
  // (preserva la rotación de cámara) ni a la lógica de movimiento.
  // IMPORTANTE: este ajuste NO depende del ángulo de cámara (rotación libre).
  const TEX_W = 1024, TEX_H = 971;
  // Bordes interiores del tablero Cluedo visibles dentro del texture
  const TEX_BOARD_X0 = 42,  TEX_BOARD_X1 = 932;
  const TEX_BOARD_Y0 = 33,  TEX_BOARD_Y1 = 890;
  boardOverlayTex.repeat.set(
    (TEX_BOARD_X1 - TEX_BOARD_X0) / TEX_W,
    (TEX_BOARD_Y1 - TEX_BOARD_Y0) / TEX_H
  );
  boardOverlayTex.offset.set(
    TEX_BOARD_X0 / TEX_W,
    1 - TEX_BOARD_Y1 / TEX_H
  );

  const boardOverlay = new THREE.Mesh(
    new THREE.PlaneGeometry(BOARD_COLUMNS, BOARD_ROWS),
    new THREE.MeshStandardMaterial({
      map: boardOverlayTex,
      transparent: false,
      roughness: 0.9,
      metalness: 0.0,
    })
  );
  boardOverlay.rotation.x = -Math.PI / 2;
  boardOverlay.position.y = 0.01;
  boardOverlay.receiveShadow = true;
  scene.add(boardOverlay);

  // Borde exterior del tablero
  const border = new THREE.Mesh(
    new THREE.BoxGeometry(BOARD_COLUMNS + 1, 0.15, BOARD_ROWS + 1),
    new THREE.MeshStandardMaterial({ color: 0x1a1008, roughness: 0.8 })
  );
  border.position.y = -0.08;
  border.receiveShadow = true;
  scene.add(border);
}

// ── Highlights de casillas válidas ────────────────────────────────────────────
const highlightGroup = new THREE.Group();
scene.add(highlightGroup);

// Usamos MeshStandardMaterial para que tengan volumen y reaccionen a la luz
function createHighlightMat(color) {
  return new THREE.MeshStandardMaterial({
    color: color,
    transparent: true,
    opacity: 0.6,
    emissive: color,
    emissiveIntensity: 0.5,
    side: THREE.DoubleSide,
  });
}

const MAT_WALKWAY = createHighlightMat(0x00e5ff);
const MAT_DOOR = createHighlightMat(0xffd700);
const MAT_ROOM = createHighlightMat(0x00ff88);

const TILE_GEO = new THREE.PlaneGeometry(0.8, 0.8);

function clearHighlights() {
  while (highlightGroup.children.length > 0) {
    highlightGroup.remove(highlightGroup.children[0]);
  }
}

function showValidTiles(tiles, validRoomIds) {
  clearHighlights();

  // Animación de pulso para las casillas
  const animateHighlights = (now) => {
    highlightGroup.children.forEach((mesh) => {
      const scale = 1 + Math.sin(now * 0.005) * 0.05;
      mesh.scale.set(scale, scale, 1);
    });
  };
  
  // Guardamos la función en el grupo para llamarla en el bucle principal
  highlightGroup.userData.update = animateHighlights;

  tiles.forEach(tile => {
    const pos = tileToThree(tile.x, tile.y);
    const isDoorway = tile.type === 'door' || tile.type === 'doorway';
    const mat = isDoorway ? MAT_DOOR : MAT_WALKWAY;
    const mesh = new THREE.Mesh(TILE_GEO, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(pos.x, 0.08, pos.z);
    highlightGroup.add(mesh);
  });

  if (validRoomIds && validRoomIds.length > 0) {
    validRoomIds.forEach(roomId => {
      const room = ROOMS.find(r => r.id === roomId);
      if (!room) return;
      const center = roomCenter(room.x0, room.x1, room.y0, room.y1);
      const geo = new THREE.PlaneGeometry(room.x1 - room.x0 + 0.8, room.y1 - room.y0 + 0.8);
      const mesh = new THREE.Mesh(geo, MAT_ROOM);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(center.x, 0.08, center.z);
      highlightGroup.add(mesh);
    });
  }
}

// ── Tokens ────────────────────────────────────────────────────────────────────
const TOKEN_OFFSETS = [
  [0, 0], [-0.8, 0], [0.8, 0],
  [0, -0.8], [-0.8, -0.8], [0.8, -0.8],
];

const tokenMeshes     = {};
const tokenTargets    = {};
const tokenAnimations = {};

function buildToken(hexColor) {
  const colorInt = parseInt(hexColor.replace('#', ''), 16);
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.28, 0.55, 16),
    new THREE.MeshStandardMaterial({
      color: colorInt,
      roughness: 0.4,
      metalness: 0.3,
      emissive: colorInt,
      emissiveIntensity: 0.25,
    })
  );
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 12, 12),
    new THREE.MeshStandardMaterial({
      color: colorInt,
      roughness: 0.3,
      metalness: 0.4,
      emissive: colorInt,
      emissiveIntensity: 0.25,
    })
  );
  head.position.y = 0.38;
  head.castShadow = true;
  group.add(head);

  const tokenLight = new THREE.PointLight(colorInt, 0.5, 3.5);
  tokenLight.position.y = 1.0;
  group.add(tokenLight);

  return group;
}

function syncPlayers(players) {
  players.forEach((player, i) => {
    let mesh = tokenMeshes[player.id];
    if (!mesh) {
      mesh = buildToken(player.hexColor);
      scene.add(mesh);
      tokenMeshes[player.id] = mesh;
    }

    mesh.visible = true;

    let targetPosition;
    if (player.roomId && ROOM_POSITIONS[player.roomId]) {
      const [rx, rz] = ROOM_POSITIONS[player.roomId];
      const inRoom = players.filter(p => p.roomId === player.roomId);
      const idx    = inRoom.findIndex(p => p.id === player.id);
      const off    = TOKEN_OFFSETS[idx] || [0, 0];
      targetPosition = new THREE.Vector3(rx + off[0], 0.5, rz + off[1]);
    } else {
      const pos = tileToThree(player.x, player.y);
      targetPosition = new THREE.Vector3(pos.x, 0.5, pos.z);
    }

    tokenTargets[player.id] = targetPosition;

    // FIX: si NO hay animación activa para este jugador, posicionamos
    // inmediatamente en la nueva posición. Si SÍ hay animación activa,
    // NO tocamos la posición aquí — la animación se encarga de moverla.
    const anim = tokenAnimations[player.id];
    const animActive = anim && anim.active;
    if (!animActive) {
      mesh.position.copy(targetPosition);
    }
  });
}

// ── Click / Tap handling ──────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

function onPointerUp(event) {
  if (diceOverlayVisible && diceCanRoll) {
    requestDiceRoll();
    return;
  }

  const clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
  const clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width)  *  2 - 1;
  mouse.y = ((clientY - rect.top)  / rect.height) * -2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const intersectPoint = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, intersectPoint);

  if (intersectPoint) {
    const tile = threeToTile(intersectPoint.x, intersectPoint.z);
    const tileX = tile.x;
    const tileY = tile.y;

    if (isInsideGrid(tileX, tileY) && !isBlockedTile(tileX, tileY)) {
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify({
          type: 'gridClick', x: tileX, y: tileY,
        }));
      }
    }
  }
}
renderer.domElement.addEventListener('pointerup', onPointerUp, false);

// ── Mensajes desde Flutter ────────────────────────────────────────────────────
window.handleFlutterMessage = function(message) {
  try {
    const msg = JSON.parse(message);
    if (msg.type === 'animateToken') {
      _startTokenAnimation(msg.playerId, msg.path, msg.duration);
    }
  } catch(e) {
    console.error('handleFlutterMessage error:', e);
  }
};

function _startTokenAnimation(playerId, path, durationMs) {
  if (tokenAnimations[playerId] && tokenAnimations[playerId].active) {
    tokenAnimations[playerId].active = false;
  }

  // FIX: si el path tiene longitud 0 o 1 (origen = destino o inválido),
  // no tiene sentido animar; saltamos al destino directamente.
  if (!path || path.length <= 1) {
    const mesh = tokenMeshes[playerId];
    if (mesh && path && path.length === 1) {
      const pos = tileToThree(path[0][0], path[0][1]);
      mesh.position.set(pos.x, 0.5, pos.z);
    }
    return;
  }

  const threePath = path.map(point => {
    const pos = tileToThree(point[0], point[1]);
    return new THREE.Vector3(pos.x, 0.5, pos.z);
  });

  tokenAnimations[playerId] = {
    startTime: performance.now(),
    duration:  durationMs,
    path:      threePath,
    mesh:      tokenMeshes[playerId] || null,
    active:    true,
  };
}

// ── Dados 3D (overlay central) ────────────────────────────────────────────────
const diceOverlayEl = document.getElementById('dice-overlay');
const diceCanvasEl  = document.getElementById('dice-canvas');
const diceHintEl    = document.getElementById('dice-hint');

const diceRenderer = new THREE.WebGLRenderer({
  canvas: diceCanvasEl,
  alpha: true,
  antialias: true,
});
diceRenderer.setPixelRatio(window.devicePixelRatio);
diceRenderer.shadowMap.enabled = true;
diceRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

const diceScene  = new THREE.Scene();
const diceCamera = new THREE.PerspectiveCamera(38, 2, 0.1, 50);
diceCamera.position.set(0, 4.2, 7.5);
diceCamera.lookAt(0, 0, 0);

diceScene.add(new THREE.AmbientLight(0xffffff, 0.85));
const diceKeyLight = new THREE.DirectionalLight(0xfff8ee, 1.1);
diceKeyLight.position.set(4, 8, 6);
diceKeyLight.castShadow = true;
diceScene.add(diceKeyLight);
const diceFillLight = new THREE.DirectionalLight(0xaaccff, 0.35);
diceFillLight.position.set(-5, 2, -3);
diceScene.add(diceFillLight);

const diceGround = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
diceGround.rotation.x = -Math.PI / 2;
diceGround.position.y = -0.72;
diceGround.receiveShadow = true;
diceScene.add(diceGround);

const FACE_VALUES = [2, 5, 1, 6, 3, 4]; // +x, -x, +y, -y, +z, -z

function createDiceFaceTexture(value) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#faf6ea');
  grad.addColorStop(1, '#e8dcc8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  ctx.strokeStyle = 'rgba(90, 70, 50, 0.25)';
  ctx.lineWidth = 6;
  ctx.strokeRect(8, 8, size - 16, size - 16);

  const pipColor = value === 1 ? '#b82020' : '#1a1410';
  const r = size * 0.075;
  const positions = {
    1: [[0.5, 0.5]],
    2: [[0.28, 0.28], [0.72, 0.72]],
    3: [[0.28, 0.28], [0.5, 0.5], [0.72, 0.72]],
    4: [[0.28, 0.28], [0.72, 0.28], [0.28, 0.72], [0.72, 0.72]],
    5: [[0.28, 0.28], [0.72, 0.28], [0.5, 0.5], [0.28, 0.72], [0.72, 0.72]],
    6: [[0.28, 0.22], [0.72, 0.22], [0.28, 0.5], [0.72, 0.5], [0.28, 0.78], [0.72, 0.78]],
  };

  (positions[value] || []).forEach(([px, py]) => {
    const x = px * size;
    const y = py * size;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = pipColor;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x - r * 0.15, y - r * 0.15, r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();
  });

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createDieMesh() {
  const textures = FACE_VALUES.map(v => createDiceFaceTexture(v));
  const materials = textures.map(tex =>
    new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.38,
      metalness: 0.05,
    })
  );
  const geo = new RoundedBoxGeometry(1.05, 1.05, 1.05, 6, 0.14);
  const mesh = new THREE.Mesh(geo, materials);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const dieMeshes = [createDieMesh(), createDieMesh()];
const diceGroup = new THREE.Group();
dieMeshes[0].position.set(-1.35, 0, 0);
dieMeshes[1].position.set(1.35, 0, 0);
dieMeshes.forEach(d => diceGroup.add(d));
diceScene.add(diceGroup);

let diceOverlayVisible = false;
let diceCanRoll = false;
let diceRolling = false;
let diceRollStart = 0;
let diceSettleStart = 0;
let diceTargetValues = null;
let diceHideTimer = null;
let lastMotionSample = { x: 0, y: 0, z: 0 };
let lastShakeAt = 0;
let motionListenerActive = false;

function resizeDiceCanvas() {
  const w = diceCanvasEl.clientWidth || 340;
  const h = diceCanvasEl.clientHeight || 170;
  diceRenderer.setSize(w, h, false);
  diceCamera.aspect = w / h;
  diceCamera.updateProjectionMatrix();
}

function eulerForDiceValue(value) {
  switch (value) {
    case 1: return new THREE.Euler(0, 0, 0);
    case 6: return new THREE.Euler(Math.PI, 0, 0);
    case 2: return new THREE.Euler(0, 0, Math.PI / 2);
    case 5: return new THREE.Euler(0, 0, -Math.PI / 2);
    case 3: return new THREE.Euler(-Math.PI / 2, 0, 0);
    case 4: return new THREE.Euler(Math.PI / 2, 0, 0);
    default: return new THREE.Euler(0, 0, 0);
  }
}

function setDieRotation(mesh, value, jitter = 0) {
  const e = eulerForDiceValue(value);
  mesh.rotation.set(
    e.x + jitter,
    e.y + jitter * 0.7,
    e.z + jitter * 0.4
  );
}

function resetDicePose() {
  dieMeshes.forEach((mesh, i) => {
    setDieRotation(mesh, 1, i * 0.08);
    mesh.position.y = 0;
  });
  diceGroup.rotation.set(0.25, -0.35, 0);
}

function showDiceOverlay() {
  diceOverlayVisible = true;
  diceCanRoll = true;
  diceRolling = false;
  diceTargetValues = null;
  if (diceHideTimer) {
    clearTimeout(diceHideTimer);
    diceHideTimer = null;
  }
  diceOverlayEl.classList.remove('fading');
  diceOverlayEl.classList.add('visible');
  diceHintEl.textContent = 'Agita el móvil o toca los dados';
  resetDicePose();
  resizeDiceCanvas();
  startMotionListener();
}

function hideDiceOverlay() {
  diceOverlayVisible = false;
  diceCanRoll = false;
  diceRolling = false;
  diceTargetValues = null;
  diceOverlayEl.classList.remove('visible', 'fading');
  stopMotionListener();
  if (diceHideTimer) {
    clearTimeout(diceHideTimer);
    diceHideTimer = null;
  }
}

function fadeOutDiceOverlay(delayMs = 900) {
  if (!diceOverlayVisible) return;
  diceCanRoll = false;
  diceOverlayEl.classList.add('fading');
  if (diceHideTimer) clearTimeout(diceHideTimer);
  diceHideTimer = setTimeout(() => hideDiceOverlay(), delayMs);
}

function requestDiceRoll() {
  if (!diceOverlayVisible || !diceCanRoll || diceRolling) return;
  diceRolling = true;
  diceCanRoll = false;
  diceRollStart = performance.now();
  diceTargetValues = null;
  diceHintEl.textContent = 'Lanzando...';

  if (window.FlutterChannel) {
    window.FlutterChannel.postMessage(JSON.stringify({ type: 'rollDice' }));
  }
}

function settleDice(values) {
  if (!values || values.length < 2) return;
  diceTargetValues = values;
  diceSettleStart = performance.now();
  diceHintEl.textContent = `Resultado: ${values[0]} + ${values[1]}`;
}

function onDeviceMotion(event) {
  if (!diceOverlayVisible || !diceCanRoll || diceRolling) return;
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  const dx = Math.abs(acc.x - lastMotionSample.x);
  const dy = Math.abs(acc.y - lastMotionSample.y);
  const dz = Math.abs(acc.z - lastMotionSample.z);
  lastMotionSample = { x: acc.x, y: acc.y, z: acc.z };

  const delta = dx + dy + dz;
  const now = Date.now();
  if (delta > 14 && now - lastShakeAt > 1400) {
    lastShakeAt = now;
    requestDiceRoll();
  }
}

function startMotionListener() {
  if (motionListenerActive) return;
  motionListenerActive = true;
  window.addEventListener('devicemotion', onDeviceMotion, false);
}

function stopMotionListener() {
  if (!motionListenerActive) return;
  motionListenerActive = false;
  window.removeEventListener('devicemotion', onDeviceMotion, false);
}

async function requestMotionPermission() {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const state = await DeviceMotionEvent.requestPermission();
      return state === 'granted';
    } catch (_) {
      return false;
    }
  }
  return true;
}

diceOverlayEl.addEventListener('click', async () => {
  await requestMotionPermission();
  requestDiceRoll();
});

function updateDiceAnimation(now) {
  if (!diceOverlayVisible) return;

  const t = now * 0.001;

  if (diceRolling && !diceTargetValues) {
    dieMeshes.forEach((mesh, i) => {
      mesh.rotation.x += 0.28 + i * 0.04;
      mesh.rotation.y += 0.34 + i * 0.03;
      mesh.rotation.z += 0.22;
      mesh.position.y = Math.abs(Math.sin(t * 9 + i)) * 0.35;
    });
    diceGroup.rotation.y = Math.sin(t * 2.5) * 0.15;
    return;
  }

  if (diceTargetValues) {
    const progress = Math.min((now - diceSettleStart) / 650, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    dieMeshes.forEach((mesh, i) => {
      const target = eulerForDiceValue(diceTargetValues[i]);
      mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, target.x, ease);
      mesh.rotation.y = THREE.MathUtils.lerp(mesh.rotation.y, target.y, ease);
      mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, target.z, ease);
      mesh.position.y = THREE.MathUtils.lerp(mesh.position.y, 0, ease);
    });
    if (progress >= 1 && !diceHideTimer) {
      fadeOutDiceOverlay(850);
    }
    return;
  }

  dieMeshes.forEach((mesh, i) => {
    mesh.rotation.y = Math.sin(t * 1.4 + i) * 0.08;
    mesh.position.y = Math.sin(t * 2 + i * 0.5) * 0.04;
  });
}

function syncDiceFromState(state) {
  const shouldShow = !!state.showDice;
  const phase = state.phase || '';
  const roll = state.lastDiceRoll;

  if (shouldShow) {
    showDiceOverlay();
    return;
  }

  if (diceOverlayVisible && phase === 'moving' && roll && roll.length >= 2 && roll[0] > 0) {
    if (!diceRolling) diceRolling = true;
    settleDice(roll);
    return;
  }

  if (diceOverlayVisible && !shouldShow) {
    hideDiceOverlay();
  }
}
function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();

  if (highlightGroup.userData.update) highlightGroup.userData.update(now);
  updateDiceAnimation(now);

  for (const playerId in tokenAnimations) {
    const anim = tokenAnimations[playerId];
    if (!anim.active || !anim.mesh) continue;

    const elapsed = now - anim.startTime;
    if (elapsed >= anim.duration) {
      anim.active = false;
      if (anim.path.length > 0) anim.mesh.position.copy(anim.path[anim.path.length - 1]);
      continue;
    }

    const segDur = anim.duration / (anim.path.length - 1);
    const si     = Math.min(Math.floor(elapsed / segDur), anim.path.length - 2);
    const sp     = Math.min((elapsed % segDur) / segDur, 1.0);
    const a = anim.path[si];
    const b = anim.path[si + 1];
    if (a && b) {
      anim.mesh.position.copy(a.clone().lerp(b, sp));
    } else {
      anim.mesh.position.copy(anim.path[anim.path.length - 1]);
    }
  }

  // Pulso suave en la luz de cada token
  Object.values(tokenMeshes).forEach((mesh, i) => {
    const light = mesh.children.find(c => c.isLight);
    if (light) light.intensity = 0.35 + 0.2 * Math.sin(now * 0.002 + i);
  });

  controls.update();
  renderer.render(scene, camera);

  if (diceOverlayVisible) {
    diceRenderer.render(diceScene, diceCamera);
  }
}

// ── Comunicación Flutter ↔ JS ─────────────────────────────────────────────────
function notifyReady() {
  if (window.FlutterChannel) {
    window.FlutterChannel.postMessage(JSON.stringify({ type: 'ready' }));
  }
}

window.updateGameState = function(jsonStr) {
  try {
    const state = JSON.parse(jsonStr);
    if (state.boardLayout) applyBoardLayout(state.boardLayout);
    if (state.players) syncPlayers(state.players);

    // Highlights: si vienen tiles válidas mostrarlas, si no limpiar
    if (state.validTiles || state.validRoomIds) {
      showValidTiles(state.validTiles || [], state.validRoomIds || []);
    } else {
      clearHighlights();
    }

    syncDiceFromState(state);
  } catch(e) {
    console.error('updateGameState error:', e);
  }
};

// ── Init ──────────────────────────────────────────────────────────────────────
buildBoard();
animate();
notifyReady();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (diceOverlayVisible) resizeDiceCanvas();
});
</script>
</body>
</html>
