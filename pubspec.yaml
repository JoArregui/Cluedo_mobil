name: cluedo_mobil
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_inappwebview: ^6.1.5
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: false
  ios: true
  image_path_ios: "assets/icons/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/cluedo_board.glb
    - assets/token.glb
    - assets/environment.hdr
    - assets/board3d.html
    - assets/board_texture.png
    - assets/images/rooms/
    - assets/images/characters/
    - assets/images/weapons/
    - assets/images/envelope/
    - assets/images/Extras/
  shaders:
    - assets/shaders/fog_of_war.frag